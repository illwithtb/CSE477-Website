{% extends 'shared/layout.html' %}

{% block extracss %}
<link rel="stylesheet"    href="{{ url_for('static', filename='main/css/login.css') }}">
{% endblock %}

{% block extrajs %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="{{ url_for('static', filename='main/js/login.js') }}" defer></script>
{% endblock %}


{% block maincontent %}
<div class="container">
    <br><br>
    <p><a class="title2">Login</a></p>
    <hr></hr>
    <input type="text" placeholder="email" id="email">
    <input type="password" placeholder="password" id="password">
    <input type="button" value="submit" onclick="checkCredentials()">
    <p id="failed"></p>
    <hr></hr>
    <p class="footer">Don't have an account?</p>
    <a href="signup"><p class="footer">Sign-Up</p></a>
</div>
{% endblock %}
